<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>OTA STORE - الدفع عبر شام كاش</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Arial, Tahoma, sans-serif;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      filter: blur(50px);
      opacity: .11;
      pointer-events: none;
      z-index: -1;
      animation: float 8s ease-in-out infinite;
    }

    body::before {
      top: -80px;
      right: -75px;
      background: #b9c8ff;
    }

    body::after {
      bottom: -90px;
      left: -75px;
      background: #d7d7d7;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(12px, -10px) scale(1.06); }
    }

    .container {
      width: min(92%, 620px);
      margin: 0 auto;
      padding: 22px 0 45px;
      text-align: center;
    }

    .title {
      margin: 0;
      font-size: clamp(27px, 7vw, 40px);
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #111;
      animation: titleIn .6s ease-out;
    }

    .subtitle {
      margin: 7px 0 20px;
      font-size: 15px;
      color: #666;
      font-weight: 700;
      animation: titleIn .7s ease-out;
    }

    @keyframes titleIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /*
      صورة العرض تُرسم على Canvas وليس داخل <img>.
      لذلك الضغط المطوّل لا يعطي تعامل الصورة المعتاد في المتصفح.
      لا يمكن منع Screenshot الخاص بنظام الهاتف نفسه.
    */
    .display-box {
      width: min(68vw, 285px);
      height: min(68vw, 285px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 18px;
      padding: 5px;
      overflow: hidden;
      box-shadow:
        0 8px 28px rgba(0,0,0,.10),
        0 0 0 1px rgba(0,0,0,.05);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      animation: imageIn .6s ease-out;
    }

    #displayCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    @keyframes imageIn {
      from { opacity: 0; transform: translateY(9px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      padding: 13px 16px;
      border: 1px solid #dedede;
      border-radius: 14px;
      background: rgba(248,248,248,.96);
      color: #111;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(0,0,0,.05);
      transition:
        transform .14s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .button:hover {
      background: #fff;
      box-shadow: 0 9px 24px rgba(0,0,0,.10);
      transform: translateY(-2px);
    }

    /* Animation عند الضغط */
    .button:active {
      transform: scale(.93);
      box-shadow: 0 2px 7px rgba(0,0,0,.12);
    }

    .download {
      margin-top: 18px;
      background: #1677ff;
      color: #fff;
      border-color: #1677ff;
      box-shadow: 0 6px 18px rgba(22,119,255,.22);
    }

    .download:hover {
      background: #0868eb;
      border-color: #0868eb;
      box-shadow: 0 10px 25px rgba(22,119,255,.30);
    }

    .download:active {
      background: #075bcf;
      border-color: #075bcf;
    }

    .code {
      margin-top: 25px;
      padding: 15px 12px;
      background: rgba(255,255,255,.94);
      border: 1px solid #e1e1e1;
      border-radius: 14px;
      direction: ltr;
      font-family: monospace;
      font-size: 15px;
      word-break: break-all;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.035);
      transition: transform .14s ease, box-shadow .18s ease, background .18s ease;
    }

    .code:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
      background: #fff;
    }

    .code:active {
      transform: scale(.93);
      background: #f1f1f1;
    }

    .copy-note {
      margin-top: 7px;
      font-size: 12px;
      color: #777;
    }

    .support {
      margin-top: 18px;
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .support:hover {
      background: #222;
    }

    .status {
      height: 20px;
      margin-top: 6px;
      font-size: 13px;
      color: #555;
    }
    @media (max-width: 480px) {
      .container {
        width: 92%;
        padding-top: 16px;
      }

      .display-box {
        width: min(70vw, 270px);
        height: min(70vw, 270px);
        aspect-ratio: 1 / 1;
      }

      .button {
        min-height: 51px;
        font-size: 16px;
      }
    }
  </style>
</head>

    const canvas = document.getElementById("displayCanvas");
    const ctx = canvas.getContext("2d");
    const downloadButton = document.getElementById("downloadButton");
    const code = document.getElementById("code");
    const status = document.getElementById("status");

    const displayImage = new Image();

    displayImage.onload = () => {
      canvas.width = displayImage.naturalWidth;
      canvas.height = displayImage.naturalHeight;

      // الصورة الجديدة للعرض فقط.
      ctx.drawImage(displayImage, 0, 0);
    };

    displayImage.src = displayData;
    // زر التحميل يحمل الصورة الأصلية الأولى، وليس صورة العرض.
    downloadButton.href = originalData;

    code.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(CODE);
      } catch (e) {
        const textarea = document.createElement("textarea");
        textarea.value = CODE;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }

      status.textContent = "تم نسخ الرقم ✓";
      setTimeout(() => status.textContent = "", 1800);
    });
  </script>
